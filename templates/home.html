<h1>Human 2.0 LMS</h1>

{% if user.is_authenticated %}

    <p>Hello, {{ user.username }}</p>
    <p>Role: {{ user.role }}</p>

    <a href="{% url 'logout' %}">
        Logout
    </a>

{% else %}

    <a href="{% url 'login' %}">
        Login
    </a>

    <a href="{% url 'register' %}">
        Register
    </a>

{% endif %}
